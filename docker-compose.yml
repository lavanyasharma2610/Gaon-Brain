version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - ./backend/assets:/app/assets
    environment:
      - PRICE_PROVIDER=csv
      - WEATHER_PROVIDER=sample
      - DISEASE_PROVIDER=demo
      - OCR_PROVIDER=none
      - MANDI_CSV=data/mandi.csv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  # Optional: seed data on first run
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.seed
    volumes:
      - ./backend/data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - setup