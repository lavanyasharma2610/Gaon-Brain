<!DOCTYPE html>
<html lang="hi">
<head><meta charset="utf-8"><title>Simulation</title>
<style>
:root{--paper:#F4EFE3;--ink:#1E1B16;--field:#3F5E3A;--turmeric:#C98A12;--terracotta:#B4492D;--indigo:#2F3E6B;--river:#8A9096;}
body{font-family:sans-serif;background:var(--paper);color:var(--ink);margin:20px;font-size:18px;}
button{min-height:48px;padding:10px 16px;font-size:18px;}
</style>
</head>
<body>
<h1>Simulation</h1>
<p>नमूना डेटा / Sample data · सिमुलेशन</p>
<label>Adoption: <input type="range" min="0" max="100" value="60" id="alpha"> <span id="av">60</span>%</label>
<canvas id="chart" width="500" height="200"></canvas>
<script>
const sl=document.getElementById('alpha');const av=document.getElementById('av');
sl.oninput=()=>{av.textContent=sl.value;};
</script>
</body>
</html>
