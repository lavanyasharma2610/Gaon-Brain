<!DOCTYPE html>
<html lang="hi">
<head><meta charset="utf-8"><title>Gaon Sanjha</title>
<style>
:root{--paper:#F4EFE3;--ink:#1E1B16;--field:#3F5E3A;--turmeric:#C98A12;--terracotta:#B4492D;--indigo:#2F3E6B;--river:#8A9096;}
body{font-family:sans-serif;background:var(--paper);color:var(--ink);margin:20px;font-size:18px;}
button{min-height:48px;padding:10px 16px;font-size:18px;}
</style>
</head>
<body>
<h1>Gaon Sanjha</h1>
<p>नमूना डेटा / Sample data · सिमुलेशन</p>
<h2>Tractor Calendar</h2><div id="tractor">Fair order by prior services.</div>
<button onclick="loadTractor()">Load</button>
<h2>Bijli Window</h2><div id="bijli">Best 3-hour window.</div>
<h2>Sinchai Card</h2><div id="sinchai">Plot: irrigate / wait / skip.</div>
<script>
async function loadTractor(){
  const r=await fetch('http://127.0.0.1:8000/tractor/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requests:[{prev_served_count:1,want_date:'2026-10-20'},{prev_served_count:0,want_date:'2026-10-19'}]})});
  const d=await r.json();
  document.getElementById('tractor').textContent=JSON.stringify(d);
}
</script>
</body>
</html>
