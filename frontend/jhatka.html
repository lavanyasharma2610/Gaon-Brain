<!DOCTYPE html>
<html lang="hi">
<head><meta charset="utf-8"><title>Jhatka Panel</title>
<style>
:root{--paper:#F4EFE3;--ink:#1E1B16;--field:#3F5E3A;--turmeric:#C98A12;--terracotta:#B4492D;--indigo:#2F3E6B;--river:#8A9096;}
body{font-family:sans-serif;background:var(--paper);color:var(--ink);margin:20px;font-size:18px;}
button{min-height:48px;padding:10px 16px;font-size:18px;}
</style>
</head>
<body>
<h1>Jhatka Panel (Shock Chain)</h1>
<p>नमूना डेटा / Sample data · सिमुलेशन</p>
<button onclick="runShock('disease')">Blight on 3 plots</button>
<button onclick="runShock('rain')">Heavy rain</button>
<button onclick="runShock('price_drop')">Price drop</button>
<div id="chain">Radar > Yield > Bazaar > Glut re-plan > Sanjha rebalance</div>
<script>
async function runShock(t){
  const r=await fetch('http://127.0.0.1:8000/shock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:t,plot_ids:[1,2,3],magnitude:1})});
  const d=await r.json();
  document.getElementById('chain').textContent=d.effects.join(' > ');
}
</script>
</body>
</html>
