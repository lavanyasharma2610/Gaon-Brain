<!DOCTYPE html>
<html lang="hi">
<head><meta charset="utf-8"><title>Gaon Radar</title>
<style>
:root{--paper:#F4EFE3;--ink:#1E1B16;--field:#3F5E3A;--turmeric:#C98A12;--terracotta:#B4492D;--indigo:#2F3E6B;--river:#8A9096;}
body{font-family:sans-serif;background:var(--paper);color:var(--ink);margin:20px;font-size:18px;}
button{min-height:48px;padding:10px 16px;font-size:18px;}
</style>
</head>
<body>
<h1>Gaon Radar</h1>
<p>नमूना डेटा / Sample data · सिमुलेशन</p>
<h2>Fasal Doctor</h2>
<input type="file" accept="image/*">
<select><option>Demo: blight</option><option>Demo: rust</option></select>
<button onclick="analyze()">Analyze</button>
<p>expert se poochho if confidence &lt; 0.7</p>
<h2>Alerts</h2><div id="alerts">No alerts.</div>
<script>
async function analyze(){
  const r=await fetch('http://127.0.0.1:8000/doctor/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({condition:'blight',confidence:0.8})});
  const d=await r.json();
  alert(JSON.stringify(d));
}
</script>
</body>
</html>
